name: Theme Color Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-colors:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run color linter
        run: npm run lint:colors
        continue-on-error: false
      
      - name: Check for hardcoded colors
        if: failure()
        run: |
          echo "❌ Hardcoded colors detected!"
          echo "Please use semantic tokens instead."
          echo "See Guide/SEMANTIC_TOKENS_GUIDE.md for details."
          exit 1
      
      - name: Success message
        if: success()
        run: |
          echo "✅ No hardcoded colors found!"
          echo "All colors use semantic tokens correctly."
